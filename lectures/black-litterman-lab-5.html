<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black–Litterman Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
/* Layout: two lecture screens. Screen 1 = equation script (left) + Figure 5 rebuilt on real data (right). Screen 2 = predictor x horizon explorer. Blue = forecast, amber = realised, red = forecasts built from the dividend yield, green = the link from today's yield to future returns. */
:root{
  --bg:#f2f4f6; --surface:#ffffff; --ink:#14202b; --muted:#5a6877; --rule:#d3dae2; --soft:#e6eaef;
  --exp:#1f4fd1; --real:#b8650f; --today:#9c2f6b; --fc:#c62828; --link:#2e8b3e;
  --f-display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141a; --surface:#151d25; --ink:#e5ebf1; --muted:#93a2b1; --rule:#2a3642; --soft:#1d2731;
  --exp:#80a3ff; --real:#f0a54a; --today:#e48ab9; --fc:#ff6b6b; --link:#5fcf74; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#151d25; --ink:#e5ebf1; --muted:#93a2b1; --rule:#2a3642; --soft:#1d2731;
  --exp:#80a3ff; --real:#f0a54a; --today:#e48ab9; --fc:#ff6b6b; --link:#5fcf74; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px 28px}
.wrap{max-width:1440px;margin:0 auto;display:grid;gap:16px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:10px 24px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(26px,3vw,38px);line-height:1.1;margin:4px 0 0;text-wrap:balance}
.screens{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:8px;flex-wrap:wrap}
.screens button{font:inherit;font-size:14px;font-weight:500;border:0;background:transparent;color:var(--muted);padding:7px 12px;border-radius:6px;cursor:pointer}
.screens button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.screens kbd{font-family:var(--f-mono);font-size:11px;margin-right:6px;color:var(--muted)}
button:focus-visible,input:focus-visible{outline:2px solid var(--exp);outline-offset:2px}

/* ---------- screen 1 ---------- */
.s1{display:grid;grid-template-columns:minmax(400px,560px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1000px){.s1{grid-template-columns:minmax(0,1fr)}}
.script{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;display:grid;gap:12px;min-width:0}
.stepnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stepnum{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.06em}
.navbtns{display:flex;gap:6px}
.nb{font:inherit;font-size:15px;border:1px solid var(--rule);background:var(--bg);color:var(--ink);width:36px;height:32px;border-radius:6px;cursor:pointer}
.nb:disabled{opacity:.35;cursor:default}
.script h2{font-family:var(--f-display);font-weight:600;font-size:24px;line-height:1.2;margin:0;text-wrap:balance}
.model{font-size:13px;color:var(--muted);border:1px dashed var(--rule);border-radius:8px;padding:6px 10px;display:grid;gap:2px}
.model{font-size:14px}
.model .eq{font-size:18px}
.eqs{display:grid;gap:12px;padding-block:4px;min-width:0}
.eq>span:first-child{overflow-x:auto;max-width:100%}
.eq{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 14px;font-size:23px;line-height:1.35;color:var(--ink);transition:opacity .25s}
.eq>span:first-child{min-width:0}
.eq.dim{opacity:.0;pointer-events:none}
.eq .ann{font-family:var(--f-mono);font-size:15.5px;line-height:1.4;color:var(--fc);white-space:nowrap;margin-left:auto;text-align:right}
.eq .ann:empty{display:none}
.eq math{font-size:1.05em}
.script p{margin:0;font-size:17px}
.pts ul{margin:0;padding-left:22px;display:grid;gap:8px;font-size:17.5px;line-height:1.45}
.pts li::marker{color:var(--fc)}
.pts b{font-family:var(--f-body);font-weight:600}
.script p b{font-family:var(--f-mono);font-weight:500;font-size:.95em}
.dots{display:flex;gap:6px}
.dot{width:24px;height:4px;border-radius:2px;background:var(--rule);border:0;padding:0;cursor:pointer}
.dot.on{background:var(--ink)}
.secs button{font-size:13px}
.ctab th.grp{text-align:center;border-bottom:1px solid var(--rule)}
.ctab td.na{color:var(--muted)}
.ctab td[data-k]{cursor:pointer}
.ctab td.sel{box-shadow:inset 0 -3px 0 var(--exp)}
.eqhd{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 0 -6px;transition:opacity .25s}
.eqhd.dim{opacity:0}
.ctab.cmp th{font-size:12.5px;padding:3px 5px;line-height:1.2}
.ctab.cmp td{padding:5px 5px;font-size:14px}
.ctab.cmp td:first-child{font-size:14.5px;white-space:nowrap}
.ctab.cmp .tgt{font-size:12.5px}
.opts{display:grid;gap:10px}
.seg2{display:flex;gap:4px;background:var(--soft);padding:3px;border-radius:7px;width:max-content;max-width:100%;flex-wrap:wrap}
.seg2 button{font:inherit;font-size:13.5px;border:0;background:transparent;color:var(--muted);padding:5px 10px;border-radius:5px;cursor:pointer}
.seg2 button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.lbl{font-size:13px;color:var(--muted)}
.ctl label{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.ctl output{font-family:var(--f-mono);color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--fc)}
.go{font:inherit;font-size:15px;font-weight:600;border:0;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:7px;cursor:pointer;justify-self:start}
canvas{display:block;width:100%}
#fig{height:600px;cursor:crosshair}
#cfig{height:620px}
#ifig{height:640px}
#pfig{height:600px}
.refs{display:grid;gap:6px;border-top:1px solid var(--rule);padding-top:12px}
.refs ul{margin:0 0 6px;padding-left:20px;display:grid;gap:6px;font-size:14.5px;line-height:1.4}
.refs a{color:var(--exp)}
.sumgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:6px 0}
@media (max-width:700px){.sumgrid{grid-template-columns:minmax(0,1fr)}}
.sc{background:var(--bg);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;display:grid;gap:8px;align-content:start}
.sc h3{font-family:var(--f-display);font-size:21px;line-height:1.2;margin:0;color:var(--ink)}
.scsrc{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--fc)}
.sc ul{margin:0;padding-left:20px;display:grid;gap:6px;font-size:15.5px;line-height:1.42}
.sc li::marker{color:var(--fc)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:6px 0}
@media (max-width:700px){.cards{grid-template-columns:minmax(0,1fr)}}
.card{font:inherit;text-align:left;background:var(--bg);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;cursor:pointer;display:grid;gap:10px;color:var(--ink)}
.card .q{font-family:var(--f-display);font-size:19px;line-height:1.35}
.card .ans{font-size:15.5px;color:var(--exp);border-top:1px solid var(--rule);padding-top:10px}
.card.open{border-color:var(--exp)}
.ctab{border-collapse:collapse;width:100%;font-size:16px;font-variant-numeric:tabular-nums}
.ctab th{font-size:14px;font-weight:500;color:var(--muted);text-align:right;padding:4px 8px;border-bottom:1px solid var(--rule)}
.ctab th:first-child,.ctab td:first-child{text-align:left}
.ctab td{padding:7px 8px;border-bottom:1px solid var(--rule);text-align:right;font-family:var(--f-mono);font-size:15px}
.ctab td:first-child{font-family:var(--f-body);font-size:16px}
.ctab .tgt{font-weight:600;font-size:14px}
.ctab .st{color:var(--exp);font-weight:600}
.ctab td:first-child{line-height:1.25}
.ctab tr[data-k]{cursor:pointer}
.ctab tr.on td{background:var(--soft)}
.ctab td.neg{color:var(--fc);font-weight:500}
.ctab td.pos{color:var(--link);font-weight:500}
#chk{height:170px}
/* ---------- start and wrap-up decks ---------- */
.deck{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:22px 40px 30px;min-height:660px;display:grid;gap:18px;align-content:start}
.deck h2{font-family:var(--f-display);font-weight:600;font-size:clamp(28px,3vw,40px);line-height:1.15;margin:0}
.deck .sub{font-size:20px;color:var(--muted);margin:-8px 0 0}
.tp{display:grid;gap:14px;padding:70px 0 0 20px;max-width:1000px}
.tp .ey{font-family:var(--f-mono);font-size:16px;letter-spacing:.08em;color:var(--real);font-weight:500}
.tp .big{font-family:var(--f-display);font-weight:600;font-size:clamp(48px,6vw,84px);line-height:1.02;margin:0}
.tp .sub2{font-size:clamp(20px,2vw,28px);color:var(--muted)}
.tp hr{border:0;border-top:1px solid var(--rule);width:420px;margin:22px 0 6px}
.tp .who{font-size:18px;line-height:1.5}
.tp .rd{font-size:16px;color:var(--muted)}
.tp .go2{margin-top:34px;font-family:var(--f-mono);font-size:14px;color:var(--muted)}
.ag{border-collapse:collapse;width:100%;font-size:19px}
.ag th{font-size:14px;font-weight:500;color:var(--muted);text-align:left;padding:6px 12px;border-bottom:1px solid var(--rule)}
.ag td{padding:14px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
.ag tr[data-go]{cursor:pointer}.ag tr[data-go]:hover td{background:var(--soft)}
.ag .lt{font-family:var(--f-mono);font-weight:600;color:var(--exp);font-size:20px;width:46px}
.ag .nm{font-weight:600}.ag .ds{display:block;font-size:15.5px;color:var(--muted);font-weight:400;margin-top:2px}
.ag .rf{font-size:15.5px;color:var(--muted);white-space:nowrap}
.chain{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:34px;margin:18px 0 6px}
@media (max-width:800px){.chain{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.box{position:relative;border:1px solid var(--rule);border-radius:10px;padding:18px 14px;text-align:center;background:var(--bg);display:grid;gap:4px}
.box:not(:last-child)::after{content:"→";position:absolute;right:-28px;top:50%;transform:translateY(-50%);font-size:24px;color:var(--muted)}
.box b{font-size:19px}.box span{font-size:16px;color:var(--muted)}.box .ss{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.box.now{border:2px solid var(--exp)}.box.dark{background:var(--ink);color:var(--bg)}.box.dark span,.box.dark .ss{color:var(--bg);opacity:.8}
.box .tag{font-family:var(--f-mono);font-size:13px;color:var(--exp);font-weight:600;margin-top:6px}
.deck ul.big{margin:0;padding-left:26px;display:grid;gap:12px;font-size:21px;line-height:1.45}
.deck ul.big li::marker{color:var(--fc)}
.deck .dim{opacity:0;transition:opacity .25s}
.tk{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:800px){.tk{grid-template-columns:minmax(0,1fr)}}
.tk .sc h3{font-size:24px}.tk .sc p{margin:0;font-size:18px;line-height:1.45}.tk .sc .num{font-family:var(--f-mono);font-size:15px;color:var(--fc);line-height:1.5}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px}
@media (max-width:800px){.two{grid-template-columns:minmax(0,1fr)}}
.two h3{font-family:var(--f-display);font-size:22px;margin:0 0 10px}
.two ol,.two ul{margin:0;padding-left:24px;display:grid;gap:9px;font-size:18px;line-height:1.42}
.two li::marker{color:var(--fc)}
.banner{font-size:22px;color:var(--bg);background:var(--ink);padding:18px 26px;border-radius:10px;margin:0}
.lnk{font:inherit;font-size:16px;font-weight:600;color:var(--exp);text-decoration:none;border:1px solid var(--rule);border-radius:8px;padding:8px 14px;display:inline-block;background:var(--bg)}
.dates{border-collapse:collapse;font-size:17px}.dates td{padding:6px 18px 6px 0;border-bottom:1px solid var(--rule)}.dates td:first-child{font-family:var(--f-mono);font-size:15px;white-space:nowrap;color:var(--muted)}
.refl{columns:2 460px;column-gap:40px;margin:0;padding-left:20px;font-size:15.5px;line-height:1.45}.refl li{break-inside:avoid;margin-bottom:8px}.refl a{color:var(--exp)}
.deck .lbl2{font-family:var(--f-mono);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* ---------- screen 2 ---------- */
.bar{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:end;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:14px 16px}
.grp{display:grid;gap:6px;min-width:0}
.grp>span{font-size:13px;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--soft);padding:4px;border-radius:8px}
.seg button{font:inherit;border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:6px;cursor:pointer;text-align:left;line-height:1.2}
.seg button b{display:block;font-size:15px;font-weight:600}
.seg button small{font-size:12px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.hz{flex:1 1 300px}
.hz label{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted)}
.hz output{font-family:var(--f-mono);font-size:24px;font-weight:500;color:var(--ink)}
.hz input{accent-color:var(--exp);height:28px}
.check{display:flex;gap:8px;align-items:center;font-size:15px;cursor:pointer;padding-bottom:6px}
.check input{accent-color:var(--exp);width:17px;height:17px}
.say{font-family:var(--f-display);font-size:clamp(18px,1.5vw,21px);line-height:1.4;margin:0;padding-left:22px;columns:2 420px;column-gap:48px}
.say li{break-inside:avoid;margin-bottom:6px}
.say li::marker{color:var(--fc)}
.say b{font-family:var(--f-mono);font-weight:500;font-size:.92em}
.say .exp{color:var(--exp)} .say .today{color:var(--today)}
.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}
@media (max-width:1000px){.grid{grid-template-columns:minmax(0,1fr)}}
figure{margin:0;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:12px 14px 10px;min-width:0;display:grid;gap:6px}
figcaption{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 14px;align-items:baseline}
figcaption b{font-weight:600;font-size:16px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px;color:var(--muted)}
.sw{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.dotsw{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle;margin-right:6px}
#ts,#sc{height:340px}
#r2{height:150px}
.foot{font-size:12.5px;color:var(--muted);border-top:1px solid var(--rule);padding-top:10px;display:flex;flex-wrap:wrap;gap:6px 20px;justify-content:space-between}
kbd.k{font-family:var(--f-mono);font-size:12px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
<style>
#cfig{height:640px}
.fightml{min-height:560px;display:grid;align-content:start;gap:14px;padding:6px 4px}
.ctl{display:grid;gap:4px}
.ctl input[type=range]{accent-color:var(--exp)}
.ctl label output{font-size:15px}
.ctl .hint{font-size:12.5px;color:var(--muted)}
.ctrlrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* horizon timeline (B1) */
.hzn{display:grid;gap:16px;margin-top:10px}
.hzn .axis{display:grid;grid-template-columns:repeat(4,1fr);font-family:var(--f-mono);font-size:14px;color:var(--muted);border-top:2px solid var(--rule);padding-top:8px}
.hzn .row{display:grid;grid-template-columns:repeat(4,1fr);align-items:center;min-height:86px;transition:opacity .25s}
.hzn .row.dim{opacity:0}
.hzn .blk{border-radius:10px;padding:12px 16px;display:grid;gap:3px;font-size:16px}
.hzn .blk b{font-size:18px}
.hzn .blk span{font-size:14.5px;opacity:.85}
.hzn .eqb{grid-column:1 / span 4;background:var(--soft);border:2px dashed var(--muted)}
.hzn .cma{grid-column:3 / span 1;background:color-mix(in srgb,var(--real) 18%,var(--surface));border:2px solid var(--real)}
.hzn .prd{grid-column:1 / span 2;background:color-mix(in srgb,var(--exp) 14%,var(--surface));border:2px solid var(--exp)}
.hzn .tag{font-family:var(--f-mono);font-size:13px;font-weight:600}
.quote{font-family:var(--f-display);font-size:20px;color:var(--muted);border-left:3px solid var(--rule);padding-left:14px;margin:6px 0 0}
/* placeholder */
.soon{font-size:19px;line-height:1.5;color:var(--muted)}
.soon ul{margin:8px 0 0;padding-left:22px}
</style>
<style>
.mxrow{display:flex;flex-wrap:wrap;gap:18px 26px;align-items:flex-start}
.mxw{display:grid;gap:6px}
.mxn{font-family:var(--f-display);font-size:20px;font-weight:600}
.mxn span{font-family:var(--f-mono);font-size:12.5px;font-weight:400;color:var(--muted);margin-left:8px}
.mxt{border-collapse:separate;border-spacing:3px;font-variant-numeric:tabular-nums}
.mxt th{font-size:13px;font-weight:500;color:var(--muted);padding:2px 6px;text-align:center}
.mxt tbody th{text-align:right}
.mxt td{font-family:var(--f-mono);font-size:16px;min-width:74px;padding:9px 8px;text-align:center;border-radius:6px;border:1px solid var(--rule)}
.mxc{font-size:13px;color:var(--muted);max-width:330px}
.vport{display:grid;gap:10px}
.vp{display:grid;grid-template-columns:80px 1fr;gap:10px;align-items:baseline;font-size:17px}
.sbar{position:relative;height:24px;min-width:120px}
.sbar .ax{position:absolute;left:50%;top:0;bottom:0;border-left:1px solid var(--muted)}
.sbar .seg{position:absolute;top:4px;height:16px;border-radius:3px;opacity:.9}
.sbar .sv{position:absolute;top:2px;font-family:var(--f-mono);font-size:12.5px;white-space:nowrap;color:var(--ink)}
.wf{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.wf th{font-size:13.5px;font-weight:500;color:var(--muted);padding:6px 8px;text-align:center}
.wf tbody th{text-align:left;color:var(--ink);font-size:15px}
.wf td{padding:8px;border-top:1px solid var(--rule);font-family:var(--f-mono);font-size:15px;text-align:center}
.wf td{vertical-align:middle}
.wf .fm{font-size:12px;color:var(--muted);margin-top:2px}
.wf tbody th{width:70px}
.byhand{background:var(--soft);border-radius:8px;padding:12px 16px;font-size:16px;line-height:1.5}
</style>
<style>
.tk .sc h3{font-size:24px}.tk .sc p{margin:0;font-size:18px;line-height:1.45}.tk .sc .num{font-family:var(--f-mono);font-size:15px;color:var(--fc);line-height:1.5}
</style>

function blk(){const S3=I3.map(i=>I3.map(j=>S[i][j])),PiA=PIv(),Pi=I3.map(i=>PiA[i]),P=[[1,0,0],[-1,1,0]],Q=[G.q1,G.q2],cs=[G.c1,G.c2],tau=G.tau;

const W9=w=>[...w,1-sumv(w)];
const blSAA=c=>BL(PIv(),P7,AQR,P7.map(()=>c),G.tau).mu;
const SAAP=()=>{const g=G.gam;return{eq:W9(optimize(PIv(),g)),mv:W9(optimize([...AQR,0],g)),bl:W9(optimize(blSAA(G.c),g))};};
function hbars(c,w,h,col,ser,o={}){const L=110,R=w-30,T0=30,B0=h-40,rh=(B0-T0)/9,X=v=>L+v/0.45*(R-L);

  c.strokeStyle=col.fc;c.setLineDash([5,4]);c.beginPath();c.moveTo(X(.4),T0);c.lineTo(X(.4),B0);c.stroke();c.setLineDash([]);txt(c,'40% cap',X(.4)+4,T0-12,col.fc,'left','middle',SANS);
  NM9.forEach((nm,i)=>{const y=T0+i*rh;txt(c,nm,L-12,y+rh/2,col.ink,'right','middle',SANS);
    const bh=Math.min(16,(rh-8)/Math.max(1,ser.length));ser.forEach(([wv9,lab,clr],j)=>{const wv=wv9[i],yy=y+rh/2-ser.length*bh/2+j*bh;
      c.fillStyle=clr;c.fillRect(L,yy+1,Math.max(0,X(Math.min(wv,.45))-L),bh-2);if(wv>0.005)txt(c,(wv*100).toFixed(0),X(Math.min(wv,.45))+4,yy+bh/2,clr,'left','middle',MONO);});});}
function drawD1(c,w,h,col){const P=SAAP(),l=C.line;hbars(c,w,h,col,[[P.eq,'',css(CEQ)],[P.mv,'',css(CVW)],[P.bl,'',css(CPO)]].filter((_,k)=>k<=Math.min(l,2)));}

function sweep(){const key=G.gam+'|'+G.tau;if(SWC[key])return SWC[key];const cs=[0,...Array.from({length:40},(_,k)=>0.025*(k+1))].map(x=>Math.min(x,0.995));
  return SWC[key]=cs.map(c=>({c,w:W9(c===0?optimize(PIv(),G.gam):optimize(blSAA(c),G.gam))}));}
const PAL=['#1f4fd1','#6f95ee','#a9c0f4','#8c6d46','#b8650f','#e3a85f','#2e8b3e','#9c2f6b','#98a3ae'];
function drawD2(c,w,h,col){const sw=sweep(),L=64,R=w-120,T0=30,B0=h-60,X=v=>L+v*(R-L),Y=v=>B0-v*(B0-T0);
  hgrid(c,Y,[0,.2,.4,.6,.8,1],v=>(v*100).toFixed(0)+'%',L,R,col);

    for(let k=sw.length-1;k>=0;k--)c.lineTo(X(sw[k].c),Y(base[k]));c.closePath();c.fillStyle=PAL[i];c.globalAlpha=.85;c.fill();c.globalAlpha=1;
    const last=sw[sw.length-1],yb=base[base.length-1];if(last.w[i]>0.03)txt(c,NM9[i],R+8,Y(yb+last.w[i]/2),PAL[i],'left','middle','600 13px "IBM Plex Sans", sans-serif');
    const y0=base[0];if(sw[0].w[i]>0.03)txt(c,`${NM9[i]} ${(sw[0].w[i]*100).toFixed(0)}`,X(0)+6,Y(y0+sw[0].w[i]/2),col.surf,'left','middle','600 12px "IBM Plex Sans", sans-serif');
    base=base.map((b,k)=>b+sw[k].w[i]);}
  for(const v of [0,.25,.5,.75,1])txt(c,v.toFixed(2),X(v),B0+14,col.mut,'center','middle',MONO);

  const strip=(arr,y,clr,lab)=>{txt(c,lab,L-12,y,clr,'right','middle','600 14px "IBM Plex Sans", sans-serif');c.fillStyle=clr;c.globalAlpha=.35;

    const tm=.5*sumv(ex.wm.map((v,i)=>Math.abs(v-P.mv[i]))),tb=.5*sumv(ex.wb.map((v,i)=>Math.abs(v-P.bl[i])));txt(c,`Draw ${RIDX%ROB.ex.length+1}: errors ${ex.e.map((x,i)=>SN[i]+' '+(x>=0?'+':'−')+Math.abs(x*100).toFixed(1)).join(' · ')}`,L-140,T1-34,col.ink,'left','middle','600 13px "IBM Plex Sans", sans-serif');
    txt(c,`turnover: mean–variance ${p0(tm)} · Black–Litterman ${p0(tb)}`,L-140,T1-14,col.fc,'left','middle',BOLD);
    NM9.forEach((nm,i)=>{const y=T1+i*rh;txt(c,nm,L-12,y+rh/2,col.ink,'right','middle',SANS);const bh=Math.min(7,(rh-4)/4);
      [[P.mv[i],css(CVW),.35],[ex.wm[i],css(CVW),1],[P.bl[i],css(CPO),.35],[ex.wb[i],css(CPO),1]].forEach(([v,clr,a],j)=>{c.fillStyle=clr;c.globalAlpha=a;c.fillRect(L,y+rh/2-2*bh+j*bh,Math.max(0,Xw(Math.min(v,.45))-L),bh-1);});c.globalAlpha=1;});
    txt(c,'light: before the error · dark: after',R,T1-14,col.mut,'right','middle',SANS);}}

/* ======================================================================

   Predictive tests on the nine-class USD data, predictors lagged one month, out of sample 2008–2025 (expanding window).
   ====================================================================== */
const DUR={r2is:.0136,r2os:.0102,fc:.0115,avg:.0252,now:'term spread 0.55 points'};
const SBV={r2is:.0375,r2os:.0046,fc:-.0168,avg:.0483,now:'yield gap −0.54 points (E/P 3.60%, 10-year 4.14%)'};
const DPV={r2is:.0150,r2os:-.0272,fc:-.0581,avg:.0734};
const muSAA=()=>blSAA(0.5),wSAA=()=>optimize(muSAA(),G.gam);
const pIG=[0,0,0,0,1,0,0,0],pSB=[1,0,0,0,-1,0,0,0];
const qDur=()=>muSAA()[4]+(DUR.fc-DUR.avg),qSB=()=>muSAA()[0]-muSAA()[4]+(SBV.fc-SBV.avg);
function taaViews(set){const P=[],Q=[],cs=[];if(set!=='sb'){P.push(pIG);Q.push(qDur());cs.push(G.cd);}if(set!=='dur'){P.push(pSB);Q.push(qSB());cs.push(G.cs);}return{P,Q,cs};}
const muTAA=set=>{const v=taaViews(set);return BL(muSAA(),v.P,v.Q,v.cs,G.tau).mu;};
const wTAA=(set,te)=>optimize(muTAA(set),G.gam,te==null?{}:{te,wref:wSAA()});
/* signed horizontal bars on canvas */
function sbarsC(c,w,h,col,vals,clr,o={}){const L=110,R=w-30,T0=o.top||40,B0=o.bot||h-30,rh=(B0-T0)/vals.length,mx=o.max||Math.max(...vals.map(Math.abs),1e-9),M=(L+R)/2,X=v=>M+v/mx*(R-L)/2*0.85;

    txt(c,o.fmt(v),v>=0?X(v)+6:X(v)-6,y+rh/2,col.ink,v>=0?'left':'right','middle',MONO);});}
function drawE1(c,w,h,col){hbars(c,w,h,col,[[W9(wSAA()),'',css(CPO)]]);}
function drawE2(c,w,h,col){const l=C.line;if(l<4){const L=60,R=w-30,T0=60,B0=h-80,lo=-.02,hi=.06,Y=v=>B0-(v-lo)/(hi-lo)*(B0-T0);
    hgrid(c,Y,nice(lo,hi,8),v=>(v*100).toFixed(0)+'%',L,R,col);txt(c,'IG bonds, excess return over cash, % a year',L,T0-26,col.ink,'left','middle','600 14px "IBM Plex Sans", sans-serif');

    c.strokeStyle=col.mut;c.beginPath();c.moveTo(L,Y(0));c.lineTo(R,Y(0));c.stroke();
    const xs=[L+(R-L)*.17,L+(R-L)*.5,L+(R-L)*.83];
    if(l>=2){bar(xs[0],DUR.avg,css(CEQ),p2(DUR.avg),'historical average');bar(xs[1],DUR.fc,css(CVW),p2(DUR.fc),'forecast today');txt(c,`→ ${p2(DUR.fc-DUR.avg)} below average`,xs[1],B0+40,col.fc,'center','middle',BOLD);}
    if(l>=3){bar(xs[2],qDur(),css(CPO),p2(qDur()),'the view q');txt(c,`= μ_SAA,IG ${p2(muSAA()[4])} ${p2(DUR.fc-DUR.avg)}`,xs[2],B0+40,col.fc,'center','middle',BOLD);}
    if(l<2){txt(c,`R²: in sample ${(DUR.r2is*100).toFixed(2)}%, out of sample ${(DUR.r2os*100).toFixed(2)}%`,(L+R)/2,(T0+B0)/2-20,col.ink,'center','middle','600 22px "IBM Plex Mono", monospace');
      if(l>=1)txt(c,`c = ${(DUR.r2os*100).toFixed(2)} / ${(DUR.r2is*100).toFixed(2)} = ${(DUR.r2os/DUR.r2is).toFixed(2)}`,(L+R)/2,(T0+B0)/2+24,css(CPO),'center','middle','600 26px "IBM Plex Mono", monospace');}

function bigNums(){const i=4,PiA=PIv(),sp=Math.sqrt(0.05)*VOL[i];
  const s1=BL(PiA,P7,AQR,P7.map(()=>0.5),0.05);   // strategic stage, all seven AQR views
  const mS=s1.mu[i],sS=Math.sqrt(s1.M[i][i]),sv1=Math.sqrt(s1.Om[i][i]);
  const q=mS+(DUR.fc-DUR.avg),s2=BL(s1.mu,[pIG],[q],[0.75],0.05),mT=s2.mu[i],sT=Math.sqrt(s2.M[i][i]),sv2=Math.sqrt(s2.Om[0][0]);
  const ws=W9(optimize(s1.mu,2.5)),wt=W9(optimize(s2.mu,2.5,{te:0.01,wref:optimize(s1.mu,2.5)}));
  return{Pi:PiA[i],sp,Q:AQR[i],sv1,mS,sS,q,sv2,mT,sT,ws,wt};}

    list.forEach(([m,s,clr,a,lw,lab])=>{c.beginPath();for(let p=0;p<=120;p++){const x=lo+(hi-lo)*p/120;p?c.lineTo(X(x),Y(pdf(x,m,s))):c.moveTo(X(x),Y(pdf(x,m,s)));}
      c.lineTo(cx+pw,bot);c.lineTo(cx,bot);c.closePath();c.fillStyle=clr;c.globalAlpha=a*.25;c.fill();c.globalAlpha=a;

      if(lab)backTxt(c,lab,Math.max(cx+40,Math.min(cx+pw-40,X(m))),Math.max(top+8,Y(pdf(m,m,s))-12),clr,'center','middle','600 13px "IBM Plex Mono", monospace',col);});
    if(sub)txt(c,sub,cx+pw/2,row.y+row.h+6,col.mut,'center','middle','12.5px "IBM Plex Sans", sans-serif');};
  const op=(x,row,s)=>txt(c,s,x,row.y+row.h/2,col.ink,'center','middle','600 30px "IBM Plex Sans", sans-serif');

/* ======================================================================
   NAVIGATION
   ====================================================================== */
const ORDER=['S','A','B','C','D','E','W'],KEYOF={S:'0',A:'A',B:'B',C:'C',D:'D',E:'E',W:'W'};
const C={part:'S',step:0,line:0};
const isDeck=p=>p==='S'||p==='W';
const stepsOf=p=>isDeck(p)?DECK[p].pages:PARTS[p].steps;
const nLines=(p,s)=>isDeck(p)?DECK[p].pages[s].n:PARTS[p].steps[s].lines.length;
function go(p,s,l){C.part=p;C.step=s;C.line=l;try{localStorage.setItem('bl-pos',JSON.stringify(C));}catch(e){}render(true);}
function fwd(){const p=C.part;if(C.line<nLines(p,C.step)-1){C.line++;render(false);return;}
  if(C.step<stepsOf(p).length-1){go(p,C.step+1,0);return;}const k=ORDER.indexOf(p);if(k<ORDER.length-1)go(ORDER[k+1],0,0);}
function back(){const p=C.part;if(C.line>0){C.line--;render(false);return;}
  if(C.step>0){go(p,C.step-1,nLines(p,C.step-1)-1);return;}const k=ORDER.indexOf(p);if(k>0){const q=ORDER[k-1],n=stepsOf(q).length;go(q,n-1,nLines(q,n-1)-1);}}
$('tabs').innerHTML=ORDER.map(p=>`<button data-p="${p}" aria-pressed="false"><kbd>${KEYOF[p]}</kbd>${isDeck(p)?DECK[p].tab:PARTS[p].tab}</button>`).join('');
$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.p,0,0));
$('dk_next').onclick=fwd;$('dk_prev').onclick=back;$('c_next').onclick=fwd;$('c_prev').onclick=back;
const KEYS='<kbd class="k">←</kbd> <kbd class="k">→</kbd> step through the build · <kbd class="k">0</kbd> start · <kbd class="k">A</kbd>–<kbd class="k">E</kbd> parts · <kbd class="k">W</kbd> wrap-up · <kbd class="k">F</kbd> full screen';
document.addEventListener('keydown',e=>{if(e.target.type==='range'&&(e.key==='ArrowLeft'||e.key==='ArrowRight'))return;const k=e.key;
  if(k==='ArrowRight'||k==='PageDown'||k===' '){fwd();e.preventDefault();return;}if(k==='ArrowLeft'||k==='PageUp'){back();e.preventDefault();return;}
  if(k==='0'){go('S',0,0);return;}const u=k.toUpperCase();if('ABCDEW'.includes(u)&&u.length===1){go(u,0,0);return;}
  if(u==='F'){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});}catch(_){}}});

/* ---------- rendering ---------- */
function renderCtrls(st){const box=$('c_ctrls');const list=st.ctrls?st.ctrls(C.line):[];let h='';
  for(const k of list){if(k==='vset'){h+=`<div class="ctrlrow"><span class="lbl">Views</span><div class="seg2" id="c_vset">${[['both','both'],['dur','duration'],['sb','stocks vs bonds']].map(([v,t])=>`<button data-v="${v}" aria-pressed="${G.vset===v}">${t}</button>`).join('')}</div></div>`;continue;}if(k==='draw'){h+=`<button class="go" id="c_draw">Show another draw</button>`;continue;}if(k==='asset'){h+=`<div class="ctrlrow"><span class="lbl">Asset</span><div class="seg2" id="c_asset"><button data-a="0" aria-pressed="${G.asset===0}">US equity</button><button data-a="4" aria-pressed="${G.asset===4}">IG bonds</button></div></div>`;continue;}
    const d=ctl[k]();h+=`<div class="ctl"><label for="s_${k}">${d.lab} <output id="o_${k}">${d.fmt(d.get())}</output></label><input type="range" id="s_${k}" min="${d.min}" max="${d.max}" step="${d.step}" value="${d.get()}"><span class="hint">${d.hint}</span></div>`;}
  if(list.length)h+=`<button class="go" id="c_reset" style="background:transparent;color:var(--ink);border:1px solid var(--rule);font-weight:500;font-size:14px;padding:6px 12px">Reset all sliders</button>`;
  box.innerHTML=h;box.hidden=!list.length;if(list.length===1&&list[0]==='draw'){const r=$('c_reset');if(r)r.remove();}
  for(const k of list){if(k==='vset'){box.querySelectorAll('#c_vset button').forEach(b=>b.onclick=()=>{G.vset=b.dataset.v;box.querySelectorAll('#c_vset button').forEach(x=>x.setAttribute('aria-pressed',x===b));renderDyn();});continue;}if(k==='draw'){$('c_draw').onclick=()=>{RIDX++;renderDyn();};continue;}if(k==='asset'){box.querySelectorAll('#c_asset button').forEach(b=>b.onclick=()=>{G.asset=+b.dataset.a;box.querySelectorAll('#c_asset button').forEach(x=>x.setAttribute('aria-pressed',x===b));renderDyn();});continue;}
    const d=ctl[k](),el=$('s_'+k);el.oninput=()=>{d.set(+el.value);$('o_'+k).textContent=d.fmt(+el.value);renderDyn();};}
  const rs=$('c_reset');if(rs)rs.onclick=()=>{Object.assign(G,{lam:2.5,gam:2.5,tau:0.05,c:0.5,vk:1,q1:0.026,q2:0.010,c1:0.5,c2:0.5,cd:0.75,cs:0.12,te:0.01,vset:'both'});renderCtrls(st);renderDyn();};}
function renderDyn(){const p=C.part,st=PARTS[p].steps[C.step],l=C.line;
  $('c_eqs').innerHTML=st.lines.map((L,i)=>L.t?`${L.hd?`<div class="eqhd ${i>l?'dim':''}">${L.hd}</div>`:''}<div class="eq ${i>l?'dim':''}"><span>${tex(typeof L.t==='function'?L.t():L.t)}</span><span class="ann">${L.a?L.a():''}</span></div>`:'').join('');
  $('c_text').innerHTML=ulC(st.text(l));
  $('c_figT').textContent=st.figT?st.figT():'';
  $('c_leg').innerHTML=(st.leg?st.leg(l):[]).map(([clr,t])=>`<span><span class="sw" style="background:${clr}"></span>${t}</span>`).join('');
  if(st.fig==='html'){$('cfig').hidden=true;$('chtml').hidden=false;$('chtml').innerHTML=st.html(l);}
  else{$('cfig').hidden=false;$('chtml').hidden=true;const {c,w,h}=prep($('cfig'));st.draw(c,w,h,COL());}}
let lastKey='';
function render(full){const p=C.part;
  [...$('tabs').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.p===p));
  $('h1').textContent=isDeck(p)?DECK[p].name:PARTS[p].name;$('keys').innerHTML=KEYS;
  $('sDeck').hidden=!isDeck(p);$('sLab').hidden=isDeck(p);
  if(isDeck(p)){const pg=DECK[p].pages[C.step];$('dk_num').textContent=`PAGE ${C.step+1} OF ${DECK[p].pages.length}`;$('dk_body').innerHTML=pg.html(C.line);if(pg.draw){const cv=$('dk_cv');requestAnimationFrame(()=>pg.draw(cv,C.line));}
    $('dk_body').querySelectorAll('tr[data-go]').forEach(r=>r.onclick=()=>go(r.dataset.go,0,0));return;}
  const st=PARTS[p].steps[C.step];
  $('c_num').textContent=`${p} · STEP ${C.step+1} OF ${PARTS[p].steps.length}`;$('c_title').textContent=st.title;
  $('c_dots').innerHTML=PARTS[p].steps.map((_,j)=>`<button class="dot ${j===C.step?'on':''}" aria-label="Step ${j+1}"></button>`).join('');
  [...$('c_dots').children].forEach((d,j)=>d.onclick=()=>go(p,j,0));
  $('c_note').textContent=st.note||'';
  const key=p+C.step+'|'+(st.ctrls?st.ctrls(C.line).join():'');if(full||key!==lastKey){renderCtrls(st);lastKey=key;}
  renderDyn();}
$('src').textContent='Case 1 data: nine asset classes, monthly excess returns over US cash, 2000–2025. λ = γ = 2.5, τ = 0.05 unless changed with the sliders.';
let rr=0;window.addEventListener('resize',()=>{cancelAnimationFrame(rr);rr=requestAnimationFrame(()=>{if(!isDeck(C.part))renderDyn();else render(false);});});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(!isDeck(C.part))renderDyn();});}catch(e){}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(!isDeck(C.part))renderDyn();});
/* start: hash (#A ... #W, #start) or last position */
{const h=(location.hash||'').slice(1).toUpperCase();if(ORDER.includes(h))go(h,0,0);else if(h==='START')go('S',0,0);
  else{let s=null;try{s=JSON.parse(localStorage.getItem('bl-pos'));}catch(e){}if(s&&ORDER.includes(s.part)&&s.step<stepsOf(s.part).length&&s.line<nLines(s.part,s.step))go(s.part,s.step,s.line);else go('S',0,0);}}
window.addEventListener('hashchange',()=>{const h=(location.hash||'').slice(1).toUpperCase();if(ORDER.includes(h))go(h,0,0);});
window.__BL={BL,optimize,PIv,G,P7,AQR,GOLD};
})();
